name: Deploy Universe Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          set -e

          mkdir -p _site
          mkdir -p _site/images

          cp -R website/. _site/
          cp -R images/. _site/images/

          echo "Website files:"
          ls -la _site

          echo "Image files:"
          ls -la _site/images

          test -f _site/index.html
          test -d _site/images

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
